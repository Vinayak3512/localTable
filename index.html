<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Input Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="panel input-panel" aria-labelledby="formTitle">
            <div>
                <p class="eyebrow">Local table</p>
                <h1 id="formTitle">User Input Table</h1>
                <p class="intro">Add, update, search, and remove user records in your browser.</p>
            </div>

            <form id="userForm" autocomplete="off">
                <input type="hidden" id="recordId">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email address" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>

                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter city" required>

                <div class="actions">
                    <button type="submit" id="submitBtn">Add User</button>
                    <button type="button" id="clearBtn" class="secondary">Clear</button>
                </div>
            </form>
        </section>

        <section class="panel table-panel" aria-labelledby="tableTitle">
            <div class="table-header">
                <div>
                    <p class="eyebrow">Records</p>
                    <h2 id="tableTitle">Saved Users</h2>
                </div>
                <input type="search" id="searchInput" placeholder="Search table">
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <p id="emptyState" class="empty-state">No users added yet.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
